notes: Kinect advertises an agent-facing shopping surface through the open Universal Commerce Protocol
  (UCP, ucp.dev) rather than a bespoke MCP server. Its /.well-known/ucp manifest declares the dev.ucp.shopping
  service with an MCP transport and an OpenRPC schema, exposing catalog search and lookup so buyer agents
  (ChatGPT, Gemini, Perplexity, and other UCP-aware agents) can read and reason over the brand's catalog.
  This is the sell-side "brand agent" surface; it is per-store and negotiated read-only. Not an npm-installable
  stdio server.
server:
  name: kinect-ucp-shopping
  protocol: Universal Commerce Protocol (UCP) 2026-04-08
  transport: mcp
  discovery: https://www.trykinect.ai/.well-known/ucp
  service: dev.ucp.shopping
  spec: https://ucp.dev/2026-04-08/specification/overview
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
tools:
- name: catalog.search
  capability: dev.ucp.shopping.catalog.search
  description: Search the brand's product catalog the way a shopping agent would.
  spec: https://ucp.dev/2026-04-08/specification/catalog
  schema: https://ucp.dev/2026-04-08/schemas/shopping/catalog_search.json
- name: catalog.lookup
  capability: dev.ucp.shopping.catalog.lookup
  description: Look up a specific product/entry in the brand's catalog.
  spec: https://ucp.dev/2026-04-08/specification/catalog
  schema: https://ucp.dev/2026-04-08/schemas/shopping/catalog_lookup.json
